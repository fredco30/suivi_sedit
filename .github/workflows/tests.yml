name: Tests

# Les 193 tests ne tournaient que sur le poste de qui les lançait. Ils tournent
# désormais à chaque poussée et sur chaque pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # requirements.txt fige pandas==2.1.4, qui n'a pas de binaire au-delà de
      # Python 3.12 : la CI vérifie l'environnement que le lanceur installe.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      # PyQt5 tourne sans affichage (QT_QPA_PLATFORM=offscreen) mais réclame
      # tout de même ses bibliothèques système.
      - name: Bibliothèques système de Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Les exports SEDIT et la base du dépôt sont versionnés : les tests qui
      # s'appuient dessus s'exécutent pour de bon au lieu d'être ignorés.
      - name: Sources de test présentes
        run: |
          test -n "$(ls data_sources/factures*.xls)"
          test -f suivi_commandes.db

      - name: Suites de tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -p 'test_*.py' -v
